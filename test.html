<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Suite - Secured Test Environment</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { color: #38bdf8; text-align: center; margin-top: 0; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      background: #334155;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .warning { color: #ef4444; }
    .timer-display { color: #38bdf8; }
    .student-info {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #0284c7;
    }
    .student-info input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      user-select: auto;
      -webkit-user-select: auto;
    }
    .q-card {
      background: #0f172a;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #38bdf8;
    }
    .q-title { font-size: 1.1rem; margin-bottom: 12px; }
    .options label {
      display: block;
      background: #1e293b;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .options label:hover { background: #334155; }
    .options input { margin-right: 10px; }
    button {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    #overlay {
      position: fixed;
      top:0; left:0; width:100vw; height:100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #results { display: none; text-align: center; }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Start Screen Overlay -->
  <div id="overlay">
    <h1>Web Dev Assessment</h1>
    <p>Time Limit: 10 Minutes | 20 Questions</p>
    <p>Switching tabs or exiting fullscreen will result in a violation penalty.</p>
    <button onclick="startTest()" style="width: auto; padding: 15px 30px;">Start Assessment (Enter Fullscreen)</button>
  </div>

  <div class="container">
    <div class="status-bar">
      <span class="timer-display">Time Remaining: <span id="timer">10:00</span></span>
      <span id="violation-count" class="warning">Violations: 0 / 3</span>
    </div>

    <!-- Netlify-Enabled Form -->
    <form id="quiz-form" name="assessment-results" method="POST" data-netlify="true">
      <!-- Hidden Netlify Form Identity -->
      <input type="hidden" name="form-name" value="assessment-results" />
      
      <!-- Hidden Result Fields -->
      <input type="hidden" name="final_score" id="hidden-score" value="" />
      <input type="hidden" name="percentage" id="hidden-percentage" value="" />
      <input type="hidden" name="violations_count" id="hidden-violations" value="0" />

      <!-- Student Details Section -->
      <div class="student-info">
        <label for="student_name"><strong>Full Name:</strong></label>
        <input type="text" id="student_name" name="student_name" placeholder="Enter your full name" required>
        
        <label for="student_id"><strong>Email / Student ID:</strong></label>
        <input type="text" id="student_id" name="student_id" placeholder="Enter your email or ID" required>
      </div>

      <div id="questions-container"></div>
      <button type="button" onclick="submitQuiz()">Submit Answers</button>
    </form>

    <div id="results">
      <h2>Assessment Completed</h2>
      <p id="score-text" style="font-size: 1.8rem; color: #4ade80; font-weight: bold;"></p>
      <p style="color: #94a3b8;">Your responses have been recorded successfully!</p>
    </div>
  </div>

  <script>
    const questions = [
      { q: "1. What is the primary role of the HTML Skeleton on a webpage?", options: ["To handle server database connections", "To define webpage content/structure with core semantic tags", "To generate dark-mode CSS styles", "To automate hosting on Netlify"], answer: 1 },
      { q: "2. Which set of elements builds the foundational structure of a bio page?", options: ["Headings, paragraphs, lists, images, and links", "setup(), draw(), rect(), and ellipse()", "Breakpoints, Flexbox, media queries, and Grid", "Variables, functions, events, and DOM manipulation"], answer: 0 },
      { q: "3. Which character is used to indicate an end (or closing) tag in HTML?", options: [">", "<", "/", "\\"], answer: 2 },
      { q: "4. Which HTML tag defines an unordered list (bulleted list)?", options: ["<ol>", "<ul>", "<list>", "<li>"], answer: 1 },
      { q: "5. What is the correct HTML code for creating a hyperlink?", options: ['<a url="https://example.com">Visit Example</a>', '<a>https://example.com</a>', '<a href="https://example.com">Visit Example</a>', '<link>https://example.com</link>'], answer: 2 },
      { q: "6. How does AI pair programming boost developer productivity with CSS?", options: ["Compiling code into executable files", "Returning instant, customizable styling code from prompts", "Physical network routing and port configuration", "Drawing shapes on a canvas"], answer: 1 },
      { q: "7. Which CSS tool is designed specifically for one-dimensional alignment?", options: ["CSS Grid", "Flexbox", "Media Queries", "DOM manipulation"], answer: 1 },
      { q: "8. Which CSS feature is used to create two-dimensional web layouts?", options: ["Flexbox", "CSS Grid", "fill(r, g, b)", "HTML Semantic Skeleton"], answer: 1 },
      { q: "9. What is the purpose of a CSS Media Query in responsive design?", options: ["Trigger a popup when a key is pressed", "Adapt page layout across different screen sizes", "Query an SQL database", "Clear the canvas background"], answer: 1 },
      { q: "10. What breakpoint condition is used in the slides to stack mobile columns?", options: ["Screens under 600px", "Canvas size under 400x400", "Frame rate under 60 FPS", "Screen width over 1200px"], answer: 0 },
      { q: "11. What does HTML stand for?", options: ["Hyperlinks and Text Markup Language", "HyperText Markup Language", "Home Tool Markup Language", "Hypertext Machine Language"], answer: 1 },
      { q: "12. Which HTML tag is used to define the root of an HTML document?", options: ["<head>", "<body>", "<title>", "<html>"], answer: 3 },
      { q: "13. Which HTML element is used for the largest and most important heading?", options: ["<h1>", "<head>", "<h6>", "<heading>"], answer: 0 },
      { q: "14. What is the correct HTML element for inserting a single line break?", options: ["<lb>", "<br>", "<break>", "<newline>"], answer: 1 },
      { q: "15. Which attribute is used to define the link destination (URL) in an <a> tag?", options: ["src", "href", "link", "url"], answer: 1 },
      { q: "16. Which HTML tag is used to display an image?", options: ["<image>", "<src>", "<img>", "<pic>"], answer: 2 },
      { q: "17. How do you write a comment in HTML?", options: ["// comment", "<!-- comment -->", "/* comment */", "<comment> comment </comment>"], answer: 1 },
      { q: "18. When designing a product ad banner, which element is MOST important for telling the viewer what to do next?", options: ["The background color gradient", 'The Call to Action (CTA) button (e.g., "Buy Now", "Learn More")', "The file size of the image", "The border radius of the main container"], answer: 1 },
      { q: "19. In graphic and web design, what is the primary purpose of an ad banner?", options: ["To write complete, long-form articles", "To capture attention and visually promote a specific product or service", "To store database records on a server", "To replace HTML code in a web application"], answer: 1 },
      { q: "20. Which of the following best defines a 'gadget' in technology?", options: ["Any machine that uses electricity to transport people", "A small, usually portable device with a specific practical function", "A large piece of industrial machinery", "A software application used for coding"], answer: 1 }
    ];

    let violations = 0;
    let timeRemaining = 600; // 10 minutes
    let timerInterval = null;

    // Render questions
    const container = document.getElementById('questions-container');
    questions.forEach((q, index) => {
      let qHtml = `<div class="q-card"><div class="q-title">${q.q}</div><div class="options">`;
      q.options.forEach((opt, optIndex) => {
        // Escape HTML tags in options so they display visually on the page
        const safeOpt = opt.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        qHtml += `<label><input type="radio" name="q${index}" value="${optIndex}"> ${safeOpt}</label>`;
      });
      qHtml += `</div></div>`;
      container.innerHTML += qHtml;
    });

    function startTest() {
      document.getElementById('overlay').style.display = 'none';
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      startTimer();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        let minutes = Math.floor(timeRemaining / 60);
        let seconds = timeRemaining % 60;
        document.getElementById('timer').innerText = 
          `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert("Time is up! Your assessment is being submitted automatically.");
          submitQuiz();
        }
      }, 1000);
    }

    // Anti-Cheating: Window blur / tab switch detection
    window.addEventListener('blur', recordViolation);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) recordViolation();
    });

    function recordViolation() {
      violations++;
      document.getElementById('violation-count').innerText = `Violations: ${violations} / 3`;
      alert(`WARNING: You left the test window! Violation ${violations} of 3.`);
      if (violations >= 3) {
        alert("Maximum violations reached. Your assessment is being submitted automatically.");
        submitQuiz();
      }
    }

    // Disable shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.key === 'F12' || e.key === 'Escape') {
        e.preventDefault();
      }
    });

    function submitQuiz() {
      // Validate Name & ID
      const nameInput = document.getElementById('student_name').value.trim();
      const idInput = document.getElementById('student_id').value.trim();

      if (!nameInput || !idInput) {
        alert("Please enter your Full Name and Email/Student ID before submitting!");
        return;
      }

      // Stop timers & listeners
      clearInterval(timerInterval);
      window.removeEventListener('blur', recordViolation);

      // Calculate score
      let score = 0;
      questions.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && parseInt(selected.value) === q.answer) {
          score++;
        }
      });

      const pct = ((score / questions.length) * 100).toFixed(1);

      // Populate hidden input fields for Netlify Form Submission
      document.getElementById('hidden-score').value = `${score} / ${questions.length}`;
      document.getElementById('hidden-percentage').value = `${pct}%`;
      document.getElementById('hidden-violations').value = violations;

      // Submit form data asynchronously via fetch to Netlify
      const quizForm = document.getElementById('quiz-form');
      const formData = new FormData(quizForm);

      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(formData).toString()
      })
      .then(() => {
        // Hide form and display results on screen
        quizForm.style.display = 'none';
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-text').innerText = `Your Score: ${score} / ${questions.length} (${pct}%)`;
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      })
      .catch((error) => {
        console.error("Form Submission Error:", error);
        alert("There was an issue logging your result to the server, but your score is displayed above.");
      });
    }
  </script>
</body>
</html>
