<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IFETH Suite - Advanced Question Creator</title>
    <link href="{{ url_for('static', filename='quill.snow.css') }}" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 40px; background-color: #f5f7fb; color: #333; }
        .container { max-width: 900px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin: 0 auto; }
        h2 { color: #0056b3; margin-top: 0; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #495057; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        
        /* Layout sizing adjustments for the core question vs mini option editors */
        #editor_q { height: 180px; font-size: 16px; background: #fff; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .opt-editor-box { height: 100px; font-size: 15px; background: #fff; }
        
        .btn-submit { background-color: #0056b3; color: white; border: none; padding: 14px 25px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background-color: #004085; }
    </style>
</head>
<body>

    <div class="container">
        <h2>IFETH Assessment Suite — Rich Text & Diagram Creator</h2>
        
        <form id="complexEditorForm" action="/admin/save-question" method="POST">
            <input type="hidden" name="formatted_question" id="hidden_q">
            <input type="hidden" name="option_a" id="hidden_a">
            <input type="hidden" name="option_b" id="hidden_b">
            <input type="hidden" name="option_c" id="hidden_c">
            <input type="hidden" name="option_d" id="hidden_d">
            
            <div class="form-group">
                <label>Question Formulation (Text & Diagrams):</label>
                <div id="editor_q"><p>Type question or drop images here...</p></div>
            </div>

            <div class="options-grid">
                <div class="form-group">
                    <label>Option A (Text or Diagram):</label>
                    <div id="editor_a"><p>Option A...</p></div>
                </div>
                <div class="form-group">
                    <label>Option B (Text or Diagram):</label>
                    <div id="editor_b"><p>Option B...</p></div>
                </div>
                <div class="form-group">
                    <label>Option C (Text or Diagram):</label>
                    <div id="editor_c"><p>Option C...</p></div>
                </div>
                <div class="form-group">
                    <label>Option D (Text or Diagram):</label>
                    <div id="editor_d"><p>Option D...</p></div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label>Correct Choice Designation Key:</label>
                <select name="correct_option" class="form-control" style="width: 30%;" required>
                    <option value="A">Option A</option>
                    <option value="B">Option B</option>
                    <option value="C">Option C</option>
                    <option value="D">Option D</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Save Rich Question to Exam Vault</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='quill.js') }}"></script>
    <script>
        // Shared configuration for the mini-editors toolbar layout (includes subscript and superscript)
        const miniToolbarOptions = [
            ['bold', 'italic'],
            [{ 'script': 'sub'}, { 'script': 'super' }],
            ['image'], 
            ['clean']
        ];

        // Shared background function to intercept image selections and route them to Flask
        function createUploadHandler(quillInstance) {
            return function() {
                const input = document.createElement('input');
                input.setAttribute('type', 'file');
                input.setAttribute('accept', 'image/*');
                input.click();

                input.onchange = async () => {
                    const file = input.files[0];
                    const formData = new FormData();
                    formData.append('image', file);

                    const response = await fetch('/admin/upload-image', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const range = quillInstance.getSelection();
                        quillInstance.insertEmbed(range.index, 'image', result.url);
                    } else {
                        alert('Image upload failed.');
                    }
                };
            };
        }

        // Initialize all 5 editors independently with superscript & subscript enabled
        const q_editor = new Quill('#editor_q', { 
            theme: 'snow', 
            modules: { 
                toolbar: [
                    ['bold', 'italic', 'underline'], 
                    [{ 'script': 'sub'}, { 'script': 'super' }], 
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }], 
                    ['image'], 
                    ['clean']
                ] 
            } 
        });
        const a_editor = new Quill('#editor_a', { theme: 'snow', modules: { toolbar: miniToolbarOptions } });
        const b_editor = new Quill('#editor_b', { theme: 'snow', modules: { toolbar: miniToolbarOptions } });
        const c_editor = new Quill('#editor_c', { theme: 'snow', modules: { toolbar: miniToolbarOptions } });
        const d_editor = new Quill('#editor_d', { theme: 'snow', modules: { toolbar: miniToolbarOptions } });

        // Bind the image processing mechanism to every toolbar instance
        q_editor.getModule('toolbar').addHandler('image', createUploadHandler(q_editor));
        a_editor.getModule('toolbar').addHandler('image', createUploadHandler(a_editor));
        b_editor.getModule('toolbar').addHandler('image', createUploadHandler(b_editor));
        c_editor.getModule('toolbar').addHandler('image', createUploadHandler(c_editor));
        d_editor.getModule('toolbar').addHandler('image', createUploadHandler(d_editor));

        // Intercept final form submission to map all HTML payloads down to the hidden inputs
        const form = document.getElementById('complexEditorForm');
        form.onsubmit = function() {
            document.getElementById('hidden_q').value = q_editor.getSemanticHTML();
            document.getElementById('hidden_a').value = a_editor.getSemanticHTML();
            document.getElementById('hidden_b').value = b_editor.getSemanticHTML();
            document.getElementById('hidden_c').value = c_editor.getSemanticHTML();
            document.getElementById('hidden_d').value = d_editor.getSemanticHTML();
        };
    </script>
</body>
</html>
