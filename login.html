<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFETH Portal Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #0056b3; margin-bottom: 5px; text-align: center; }
        p { text-align: center; color: #6c757d; font-size: 0.9rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1px solid #dee2e6; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .btn { width: 100%; background-color: #0056b3; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: 600; margin-top: 10px; }
        .btn:hover { background-color: #004085; }
        .error-msg { color: #dc3545; text-align: center; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>IFETH Exam Suite</h2>
    <p>Please enter your credentials to begin your assessment</p>
    
    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="reg_no">Registration Number / Pin</label>
            <input type="text" id="reg_no" name="reg_no" placeholder="e.g., IFETH/ST/001" required autocomplete="off">
        </div>
        <button type="submit" class="btn">Verify Profile</button>
    </form>
</div>

</body>
</html>
